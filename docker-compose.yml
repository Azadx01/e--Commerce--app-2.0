version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: revivo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revivo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-revivo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revivo_user} -d ${POSTGRES_DB:-revivo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: revivo_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ReVivo FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revivo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://revivo_user:devpassword123@db:5432/revivo_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-revivo_dev_secret_key_9f38bc1a4e21a8d05e26b1c7f0d34a5b}
      PAYMENT_PROVIDER: sandbox
      PAYMENT_SANDBOX_MODE: "true"
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      # Mount code directory for real-time hot reloading during local development
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
  redis_data:
